<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EucliDraw 실험실</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243a;font:16px system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:24px}h1{margin-bottom:8px}p{line-height:1.6;color:#526078}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #1730570c}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end}label{display:grid;gap:8px;font-size:14px}select,input,button{font:inherit;border:1px solid #cbd4e2;border-radius:8px;padding:10px}button{background:#284bd5;color:white;cursor:pointer}button.secondary{background:white;color:#284bd5}svg{width:100%;height:480px;margin-top:20px;background:#fafcff;border:1px solid #e0e6ef;border-radius:12px}#status{min-height:48px}footer{font-size:13px;color:#63718b}input[type=range]{padding:0}input[type=color]{width:60px;height:44px} @media(max-width:600px){main{margin:8px auto;padding:14px}svg{height:350px}}</style>
<main><h1>EucliDraw 실험실</h1><p>도형을 선택하고 크기를 바꿔 보세요. 원본 Python 도형을 브라우저에서 살펴보는 실험판입니다.</p><div class="panel"><div class="controls"><label>도형<select id="shape"></select></label><label>크기 <span id="sizeText">100%</span><input id="size" type="range" min="25" max="150" value="100"></label><label>선 색상<input id="color" type="color" value="#284bd5"></label><button id="draw">그리기</button><button class="secondary" id="clear">지우기</button><button class="secondary" id="save">SVG 저장</button></div><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="-350 -260 700 520" role="img" aria-label="선택한 도형"></svg><p id="status" role="status"></p></div><footer><p>원본 도형의 길이와 각도를 사용합니다. 일부 도형은 닫히지 않거나 이름과 구성이 다릅니다. 육각별은 원본 인덱스 오류를 수정했습니다. 이 실험판은 이메일을 보내지 않습니다.</p></footer></main>
<script>
const shapes=__SHAPE_DATA__;
const labels={equilateral_triangle:'정삼각형',right_angled_triangle:'직각삼각형',scalene_triangle:'부등변삼각형',isosceles_triangle:'이등변삼각형',obtuse_triangle:'둔각삼각형',isosceles_obtuse_triangle:'이등변 둔각삼각형',square:'정사각형',rectangle:'직사각형',rhombus:'마름모',parallelogram:'평행사변형',trapezium:'사다리꼴',kite:'연꼴',pentagon:'오각형',hexagon:'육각형',heptagon:'칠각형',octagon:'팔각형',nonagon:'구각형',decagon:'십각형',hendecagon:'십일각형',dodecagon:'십이각형',circle:'원',semicircle:'반원',heart:'하트',quatrefoil:'네잎 모양',sector_of_circle:'부채꼴',segment_of_circle:'활꼴',annulus:'고리',vertical_ellipse:'세로 타원',horizontal_ellipse:'가로 타원',hexagram:'육각별 (오류 수정)'};
const $=id=>document.getElementById(id), select=$('shape'), canvas=$('canvas');
shapes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=labels[s.name]||s.name.replaceAll('_',' ');select.append(o)});
select.value=shapes.findIndex(s=>s.name==='square');
function draw(){const s=shapes[+select.value],pts=s.paths.flat(),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;const fit=Math.min(520/Math.max(1,Math.max(...xs)-Math.min(...xs)),360/Math.max(1,Math.max(...ys)-Math.min(...ys)));const scale=fit*+$('size').value/100;canvas.replaceChildren();s.paths.forEach(points=>{const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points.map(([x,y])=>`${(x-cx)*scale},${-(y-cy)*scale}`).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',$('color').value);p.setAttribute('stroke-width','2.5');p.setAttribute('stroke-linejoin','round');canvas.append(p)});const gap=Math.max(...s.paths.map(p=>Math.hypot(p.at(-1)[0]-p[0][0],p.at(-1)[1]-p[0][1])));$('status').textContent=`${labels[s.name]||s.name} · 경로 시작점과 끝점의 최대 간격: ${gap.toFixed(3)} 원본 단위. `+(s.name==='concave_decagon'?'주의: 원본은 오각별 경로를 두 번 반복합니다.':gap>0.1?'주의: 원본 경로가 정확하게 닫히지 않습니다.':'경로가 닫혀 있습니다. 도형의 다른 수학적 성질까지 검증한 것은 아닙니다.');$('sizeText').textContent=$('size').value+'%'}
$('draw').onclick=draw;select.onchange=draw;$('size').oninput=draw;$('color').oninput=draw;$('clear').onclick=()=>{canvas.replaceChildren();$('status').textContent='캔버스를 지웠습니다. 그리기를 누르면 다시 표시됩니다.'};$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(canvas)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=`euclidraw-${shapes[+select.value].name}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();
</script></html>
